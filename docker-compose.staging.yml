version: '3.8'

# ==============================================================================
# DOC-010 §10.5 — Staging Environment Overrides
# ==============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Staging mirrors production topology with relaxed resource constraints
# and development-friendly logging.
# ==============================================================================

services:
  api-core:
    environment:
      - NODE_ENV=staging
      - LOG_LEVEL=debug
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  queue-worker:
    environment:
      - NODE_ENV=staging
      - LOG_LEVEL=debug
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  postgres-db:
    environment:
      POSTGRES_DB: zayjar_staging

  redis-cache:
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru

  qr-menu-app:
    environment:
      - NODE_ENV=staging

  backoffice-app:
    environment:
      - NODE_ENV=staging

  cashier-app:
    environment:
      - NODE_ENV=staging
