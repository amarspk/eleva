name: CD

on:
  # Trigger 1: Staging — auto-deploy on successful CI
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Trigger 2: Production — only on GitHub Release
  release:
    types: [published]

  # Trigger 3: Production — manual workflow_dispatch
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Docker image tag to deploy (commit SHA or release tag)"
        required: false
        type: string

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/zayjar

jobs:
  # ==========================================
  # Gate: Only proceed if CI passed (staging path)
  # ==========================================
  ci-check:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI passed
        run: echo "CI workflow completed successfully, proceeding with staging deployment."

  # ==========================================
  # Job 1: Build & Push Docker Images
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    needs: [ci-check]
    if: >
      always() &&
      (needs.ci-check.result == 'success' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: qr-menu
            dockerfile: apps/qr-menu/Dockerfile
          - app: backoffice
            dockerfile: apps/backoffice/Dockerfile
          - app: cashier
            dockerfile: apps/cashier/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 2: Deploy to Staging (auto on CI success)
  # ==========================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.zayjar.com
    env:
      DEPLOY_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "deploy_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: ${TAG}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster credentials
        run: |
          set -euo pipefail
          KUBECONFIG_VALUE='${{ secrets.KUBECONFIG_STAGING }}'
          if [ -z "$KUBECONFIG_VALUE" ]; then
            echo "ERROR: KUBECONFIG_STAGING secret is not configured."
            echo "Add the staging kubeconfig (raw YAML or base64-encoded) to the repository secrets — refusing to no-op a deployment."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBECONFIG_VALUE" | base64 --decode > /dev/null 2>&1; then
            printf '%s' "$KUBECONFIG_VALUE" | base64 --decode > "$HOME/.kube/config"
          else
            printf '%s' "$KUBECONFIG_VALUE" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Deploy to staging (kubectl apply)
        run: |
          set -euo pipefail
          echo "=== Deploying to staging environment ==="
          # Converge application manifests only; k8s/secrets.yml (placeholder
          # values) and the stateful data tier are NOT re-applied — see k8s/README.md.
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/api/
          kubectl apply -f k8s/worker/
          kubectl apply -f k8s/qr-menu/
          kubectl apply -f k8s/backoffice/
          kubectl apply -f k8s/cashier/

      - name: Pin images to deploy tag
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.deploy_tag }}"
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}"
          kubectl -n zayjar set image deployment/api api="${BASE}/api:${TAG}"
          kubectl -n zayjar set image deployment/worker worker="${BASE}/api:${TAG}"
          kubectl -n zayjar set image deployment/qr-menu qr-menu="${BASE}/qr-menu:${TAG}"
          kubectl -n zayjar set image deployment/backoffice backoffice="${BASE}/backoffice:${TAG}"
          kubectl -n zayjar set image deployment/cashier cashier="${BASE}/cashier:${TAG}"

      - name: Wait for rollouts
        run: |
          set -euo pipefail
          kubectl -n zayjar rollout status deployment/api --timeout=300s
          kubectl -n zayjar rollout status deployment/worker --timeout=300s
          kubectl -n zayjar rollout status deployment/qr-menu --timeout=300s
          kubectl -n zayjar rollout status deployment/backoffice --timeout=300s
          kubectl -n zayjar rollout status deployment/cashier --timeout=300s

      - name: Health check — staging
        run: |
          chmod +x .github/scripts/health-check.sh
          .github/scripts/health-check.sh "${{ secrets.STAGING_API_URL }}" "staging"

      - name: Rollback on failure
        if: failure()
        run: |
          chmod +x .github/scripts/rollback.sh
          .github/scripts/rollback.sh "staging" "${{ secrets.STAGING_API_URL }}"

      - name: Notify deployment
        if: always()
        run: |
          echo "[staging] Deployment notification: ${{ job.status }}"

  # ==========================================
  # Job 3: Deploy to Production (release tag OR manual dispatch)
  # ==========================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: https://api.zayjar.com
    env:
      DEPLOY_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.image_tag || github.sha }}"
          fi
          echo "deploy_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: ${TAG}"

      - name: Verify release tag
        if: github.event_name == 'release'
        run: |
          echo "=== Release deployment triggered ==="
          echo "Release: ${{ github.event.release.tag_name }}"
          echo "Prerelease: ${{ github.event.release.prerelease }}"
          echo ""

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster credentials
        run: |
          set -euo pipefail
          KUBECONFIG_VALUE='${{ secrets.KUBECONFIG_PRODUCTION }}'
          if [ -z "$KUBECONFIG_VALUE" ]; then
            echo "ERROR: KUBECONFIG_PRODUCTION secret is not configured."
            echo "Add the production kubeconfig (raw YAML or base64-encoded) to the repository secrets — refusing to no-op a deployment."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBECONFIG_VALUE" | base64 --decode > /dev/null 2>&1; then
            printf '%s' "$KUBECONFIG_VALUE" | base64 --decode > "$HOME/.kube/config"
          else
            printf '%s' "$KUBECONFIG_VALUE" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Deploy to production (kubectl apply)
        run: |
          set -euo pipefail
          echo "=== Deploying to production environment ==="
          echo "Trigger: ${{ github.event_name }}"
          # Converge application manifests only; k8s/secrets.yml (placeholder
          # values) and the stateful data tier are NOT re-applied — see k8s/README.md.
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/api/
          kubectl apply -f k8s/worker/
          kubectl apply -f k8s/qr-menu/
          kubectl apply -f k8s/backoffice/
          kubectl apply -f k8s/cashier/

      - name: Pin images to deploy tag
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.deploy_tag }}"
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}"
          kubectl -n zayjar set image deployment/api api="${BASE}/api:${TAG}"
          kubectl -n zayjar set image deployment/worker worker="${BASE}/api:${TAG}"
          kubectl -n zayjar set image deployment/qr-menu qr-menu="${BASE}/qr-menu:${TAG}"
          kubectl -n zayjar set image deployment/backoffice backoffice="${BASE}/backoffice:${TAG}"
          kubectl -n zayjar set image deployment/cashier cashier="${BASE}/cashier:${TAG}"

      - name: Wait for rollouts
        run: |
          set -euo pipefail
          kubectl -n zayjar rollout status deployment/api --timeout=300s
          kubectl -n zayjar rollout status deployment/worker --timeout=300s
          kubectl -n zayjar rollout status deployment/qr-menu --timeout=300s
          kubectl -n zayjar rollout status deployment/backoffice --timeout=300s
          kubectl -n zayjar rollout status deployment/cashier --timeout=300s

      - name: Health check — production
        run: |
          chmod +x .github/scripts/health-check.sh
          .github/scripts/health-check.sh "${{ secrets.PRODUCTION_API_URL }}" "production"

      - name: Smoke test — production
        run: |
          echo "=== Running smoke tests against production ==="
          API_URL="${{ secrets.PRODUCTION_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "PRODUCTION_API_URL not configured, skipping smoke tests"
            exit 0
          fi

          echo "Testing GET /health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" || echo "000")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAIL: Health endpoint returned $HTTP_STATUS (expected 200)"
            exit 1
          fi
          echo "PASS: Health endpoint returned 200"

      - name: Rollback on failure
        if: failure()
        run: |
          chmod +x .github/scripts/rollback.sh
          .github/scripts/rollback.sh "production" "${{ secrets.PRODUCTION_API_URL }}"

      - name: Notify deployment
        if: always()
        run: |
          echo "[production] Deployment notification: ${{ job.status }}"
