name: CI

on:
  push:
    branches: [main, phase-3/eleva-builder]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: Code Quality (lint + type check)
  # ==========================================
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # ==========================================
  # Job 2: Unit & Integration Tests
  # ==========================================
  test:
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # Same as the build job: the committed generated client predates
        # Phase 3 (no isPreorder/TenantDesign), so the tests must run against
        # a client regenerated from the current schema.
        run: pnpm --filter @zayjar/db run prisma:generate

      - name: Build workspace dependencies (types, db)
        # Root `pnpm test` (jest, ts-jest) resolves @zayjar/types and
        # @zayjar/db from their dist outputs — without these builds every api
        # suite fails to load ("Cannot find module '@zayjar/types'/'@zayjar/db'").
        # Repository dependency order: types → db → tests.
        run: |
          pnpm --filter @zayjar/types build
          pnpm --filter @zayjar/db build

      - name: Run tests
        run: pnpm test

  # ==========================================
  # Job 3: Build Verification
  # ==========================================
  build:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @zayjar/db run prisma:generate

      - name: Validate Prisma schema
        # `prisma validate` resolves datasource `url = env("DATABASE_URL")` before
        # validating, so it hard-fails with P1012 when the variable is unset.
        # This step is a static schema check only — it never opens a connection —
        # so a syntactically valid placeholder URL is sufficient and keeps the
        # job free of any database service dependency.
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/prisma?schema=public
        run: pnpm --filter @zayjar/db exec prisma validate

      - name: Verify required partial indexes are not reverted
        # Regression guard: the 5 uniqueness bounds rebuilt as PARTIAL indexes
        # by migration 20260804000000 (DOC-002 §28/29/114/234/448/602) must
        # stay partial. Prisma cannot express partial indexes, so a future
        # `prisma migrate dev` could regenerate them as FULL indexes — this
        # static scan of the committed migration chain fails the job if any of
        # the 5 final definitions is not a partial unique index with the
        # authoritative predicate. Pure static analysis; no database needed.
        run: pnpm --filter @zayjar/db run verify:partial-indexes

      - name: Build all packages
        run: pnpm build

  # ==========================================
  # Job 4: Docker Image Build Verification
  # ==========================================
  docker:
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image (verification only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: zayjar/api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build QR Menu Docker image (verification only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/qr-menu/Dockerfile
          push: false
          tags: zayjar/qr-menu:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backoffice Docker image (verification only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backoffice/Dockerfile
          push: false
          tags: zayjar/backoffice:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Cashier Docker image (verification only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/cashier/Dockerfile
          push: false
          tags: zayjar/cashier:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 5: Live browser + database verification (Phase 3)
  # ==========================================
  # Closes the Phase 3 verification gaps recorded in PROJECT_STATE.md:
  # real Chromium -> real Next (production build) -> real API (compiled dist)
  # -> real PostgreSQL. The Playwright spec (tests/e2e/verify-phase3-live.spec.ts)
  # contains NO API mocks. Run with: playwright.live.config.ts (no webServer —
  # the stack is provisioned and health-checked by this job itself).
  e2e-live:
    runs-on: ubuntu-latest
    # Depends on build (which depends on code-quality). Deliberately NOT on the
    # `test` job: the root jest suite carries 5 tracked PRE-EXISTING failures
    # (identical to main, documented in PROJECT_STATE.md — must not be hidden),
    # and they would otherwise skip this live verification on every run. The
    # `test` job still executes and reports its own result independently.
    needs: [build]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zayjar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zayjar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zayjar?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: zayjar-e2e-live-jwt-secret-00000000000000000000
      JWT_REFRESH_SECRET: zayjar-e2e-live-jwt-refresh-secret-00000000000000
      # NOTE: no job-level NODE_ENV — a dev value leaked into `next build` and
      # broke prerendering (<Html>/useContext errors). NODE_ENV is set per step:
      # production for the production builds/servers, development for the API boot.
      # qr-menu rewrites /api/* to this base (baked at build time AND read at
      # runtime by resolveServerApiBase); the tenant subdomain is required so
      # TenantContextMiddleware can resolve tenancy from the Host header.
      API_INTERNAL_URL: http://albaik.localhost:8000
      PLAYWRIGHT_BASE_URL: http://albaik.localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @zayjar/db run prisma:generate

      - name: Mark parked migration M4 as applied (R2/PREX-MIG-002)
        # M4 (orders_partitioning_by_year) is parked non-shippable per the
        # standing R2/PREX-MIG-002 closure. `migrate resolve --applied`
        # records it in _prisma_migrations so `migrate deploy` skips it and
        # applies the remaining shippable chain in order.
        run: pnpm --filter @zayjar/db exec prisma migrate resolve --applied 20260726000001_orders_partitioning_by_year

      - name: Apply migrations (shippable chain, M4 parked)
        run: pnpm --filter @zayjar/db run prisma:migrate

      - name: Seed demo tenants
        run: pnpm --filter @zayjar/db run prisma:seed

      - name: Build all packages
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Map tenant subdomain to localhost
        run: echo "127.0.0.1 albaik.localhost" | sudo tee -a /etc/hosts

      - name: Boot API (compiled dist, port 8000)
        env:
          NODE_ENV: development
        run: |
          nohup node apps/api/dist/main.js > /tmp/zayjar-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "API healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "--- API log tail ---"
          tail -100 /tmp/zayjar-api.log
          exit 1

      - name: Boot QR menu (production build, port 3000)
        env:
          NODE_ENV: production
        run: |
          nohup pnpm --filter @zayjar/qr-menu exec next start -p 3000 > /tmp/zayjar-qr.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://albaik.localhost:3000/ > /dev/null 2>&1; then
              echo "QR menu healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "--- QR menu log tail ---"
          tail -100 /tmp/zayjar-qr.log
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live Phase 3 browser/DB verification
        run: npx playwright test tests/e2e/verify-phase3-live.spec.ts --config playwright.live.config.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
