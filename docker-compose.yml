version: '3.8'

services:
  # 1. Relational Database Engine
  postgres-db:
    image: postgres:15-alpine
    container_name: zayjar-postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Connection Pooler Layer
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: zayjar-pgbouncer
    restart: always
    ports:
      - "6432:6432"
    env_file: .env
    environment:
      - DB_HOST=postgres-db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=50
    depends_on:
      postgres-db:
        condition: service_healthy

  # 3. Volatile Cache & Queue Store
  redis-cache:
    image: redis:7.2-alpine
    container_name: zayjar-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    env_file: .env
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Modular Monolith Core API
  api-core:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zayjar-api
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT:-8000}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_READ_URL=${DATABASE_READ_URL:-${DATABASE_URL}}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - SYSTEM_PEPPER=${SYSTEM_PEPPER}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - TAP_PAYMENTS_SECRET_KEY=${TAP_PAYMENTS_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      - UNIFONIC_APP_SID=${UNIFONIC_APP_SID}
      - UNIFONIC_SENDER_ID=${UNIFONIC_SENDER_ID}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      # DOC-006 §5.9: AWS Secrets Manager configuration
      # When set, the application fetches secrets from AWS Secrets Manager at startup.
      # In production (ECS), use IAM Task Execution Role instead of explicit AWS credentials.
      - AWS_SECRETS_MANAGER_SECRET_ID=${AWS_SECRETS_MANAGER_SECRET_ID:-}
    depends_on:
      pgbouncer:
        condition: service_started
      redis-cache:
        condition: service_healthy

  # 5. Background Asynchronous Worker Pool
  queue-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zayjar-worker
    restart: always
    command: ["pnpm", "--filter", "@zayjar/api", "run", "start:worker"]
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      redis-cache:
        condition: service_healthy

  # 6. Customer QR Menu Frontend
  qr-menu-app:
    build:
      context: .
      dockerfile: apps/qr-menu/Dockerfile
    container_name: zayjar-qr-menu
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-core:8000
    depends_on:
      - api-core

  # 7. Tenant Backoffice Management Panel
  backoffice-app:
    build:
      context: .
      dockerfile: apps/backoffice/Dockerfile
    container_name: zayjar-backoffice
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-core:8000
    depends_on:
      - api-core

  # 8. Cashier Terminal PWA (Offline-First) per DOC-001 1.3
  cashier-app:
    build:
      context: .
      dockerfile: apps/cashier/Dockerfile
    container_name: zayjar-cashier
    restart: always
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-core:8000
    depends_on:
      - api-core

volumes:
  pg-data:
    driver: local
  redis-data:
    driver: local
