# ========================================================
# NGINX PRODUCTION INGRESS REVERSE PROXY CONFIGURATION
# Per DOC-010 Appendix D.2
# ========================================================

# DOC-007 §6.4 — CDN base URL (empty = serve images directly from API)
# When set to e.g. https://cdn.zayjar.com, media URLs in API responses
# are rewritten to route through CloudFront edge caching.
# CDN_BASE_URL is injected via environment variable in docker-compose.

# Rate limiting zones declaration per DOC-006 5.6
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

upstream core_backend_upstream {
    server api-core:8000;
    keepalive 32;
}

upstream qr_frontend_upstream {
    server qr-menu-app:3000;
    keepalive 32;
}

upstream backoffice_frontend_upstream {
    server backoffice-app:3000;
    keepalive 32;
}

upstream cashier_frontend_upstream {
    server cashier-app:3000;
    keepalive 32;
}

# 1. Redirection: Force secure SSL across all environments
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# 2. Dynamic Routing: Customer QR Menus & Ordering (Wildcard subdomains)
server {
    listen 443 ssl http2;
    server_name *.zayjar.com;

    # SSL Certificate binds managed via ACM
    ssl_certificate /etc/letsencrypt/live/zayjar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zayjar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # AUDIT-020 — edge transport/baseline headers. Hide duplicate upstream
    # baseline values before setting the edge copy. The QR host already enforced
    # CSP before AUDIT-020; preserve that control with a reviewed, Next-compatible
    # policy while the application also emits the future stricter candidate in
    # Report-Only mode. Backoffice/Cashier had no enforced CSP and remain
    # Report-Only until their compatibility evidence is complete.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Content-Security-Policy "default-src 'self' https:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none';" always;

    # Route API queries securely with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://core_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Correlation-ID $request_id;
    }

    # DOC-007 §6.4 — Proxy media images through CloudFront CDN
    # When CDN_BASE_URL is set, the API returns cdn.zayjar.com URLs directly;
    # this block is a fallback that rewrites /media/* requests to the CDN origin
    # for edge-cached delivery (Cache-Control: public, max-age=31536000, immutable).
    location ~* ^/tenants/.+\.(webp|jpg|jpeg|png|gif|avif|pdf)$ {
        # If CDN is configured, proxy to CloudFront for edge caching
        set $cdn_base "${CDN_BASE_URL}";
        if ($cdn_base != "") {
            proxy_pass $cdn_base$request_uri;
        }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Match CloudFront cache policy: 1-year immutable for media.
        # This location has its own add_header directives, so nginx does not
        # inherit the server-level set; repeat the security baseline explicitly.
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
    }

    # Route real-time KDS WebSockets per DOC-008 7.6
    location /socket.io/ {
        proxy_pass http://core_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Proxy route fallback to QR Menu static web server
    location / {
        proxy_pass http://qr_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 3. Backoffice routing (admin.zayjar.com or backoffice subdomain)
server {
    listen 443 ssl http2;
    server_name admin.zayjar.com backoffice.zayjar.com;

    ssl_certificate /etc/letsencrypt/live/zayjar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zayjar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # AUDIT-020 — edge baseline; app-specific report-only CSP, referrer and
    # capability policy pass through from the Backoffice Next.js application.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://core_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://backoffice_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 4. Cashier Terminal PWA routing (cashier.zayjar.com) per DOC-001 1.3 Offline-First
server {
    listen 443 ssl http2;
    server_name cashier.zayjar.com;

    ssl_certificate /etc/letsencrypt/live/zayjar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zayjar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # AUDIT-020 — edge baseline; the Cashier app owns report-only CSP and
    # service-worker-aware browser policy.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;

    # PWA service worker and manifest
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|json)$ {
        proxy_pass http://cashier_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        # Local add_header disables inheritance; repeat the security baseline.
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://core_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://cashier_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
