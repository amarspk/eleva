apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: zayjar
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: zayjar
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: zayjar
    spec:
      terminationGracePeriodSeconds: 45
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: ghcr.io/amarspk/zayjar/api:latest
          command: ["node", "apps/api/dist/worker.js"]
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: zayjar-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zayjar-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: zayjar-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: zayjar-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: zayjar-secrets
                  key: JWT_REFRESH_SECRET
            - name: SYSTEM_PEPPER
              valueFrom:
                secretKeyRef:
                  name: zayjar-secrets
                  key: SYSTEM_PEPPER
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: zayjar-secrets
                  key: STRIPE_SECRET_KEY
            - name: TAP_PAYMENTS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: zayjar-secrets
                  key: TAP_PAYMENTS_SECRET_KEY
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: zayjar-config
                  key: AWS_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: zayjar-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: zayjar-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: zayjar-config
                  key: S3_BUCKET
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: zayjar-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zayjar-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_FROM_NUMBER
              valueFrom:
                configMapKeyRef:
                  name: zayjar-config
                  key: TWILIO_FROM_NUMBER
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zayjar-secrets
                  key: SENDGRID_API_KEY
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: zayjar-config
                  key: SENDGRID_FROM_EMAIL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'node apps/api/dist/worker.js' || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'node apps/api/dist/worker.js' || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
