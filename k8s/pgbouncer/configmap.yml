apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: zayjar
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/part-of: zayjar
data:
  pgbouncer.ini: |
    [databases]
    zayjar_production = host=postgres port=5432 dbname=zayjar_production

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    default_pool_size = 40
    max_client_conn = 500
    min_pool_size = 10
    reserve_pool_size = 5
    reserve_pool_timeout = 5
    server_idle_timeout = 600
    client_idle_timeout = 0
    log_connections = 0
    log_disconnections = 0
  userlist.txt: |
    "postgres_admin" "md5$(echo -n 'POSTGRES_PASSWORD_PLACEHOLDER' | md5sum | cut -d' ' -f1)"
