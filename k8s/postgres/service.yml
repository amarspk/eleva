apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: zayjar
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: zayjar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
