apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zayjar-ingress
  namespace: zayjar
  labels:
    app.kubernetes.io/part-of: zayjar
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.zayjar.com
        - qr.zayjar.com
        - backoffice.zayjar.com
        - cashier.zayjar.com
      secretName: zayjar-tls
  rules:
    - host: api.zayjar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
    - host: qr.zayjar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qr-menu
                port:
                  number: 3000
    - host: backoffice.zayjar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backoffice
                port:
                  number: 3001
    - host: cashier.zayjar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cashier
                port:
                  number: 3002
