# ==============================================================================
# DOC-009 8.5 - PostgreSQL Backup Configuration
# ==============================================================================
# Source this file in backup/restore scripts.
# All values have sensible defaults; override via environment variables.
# ==============================================================================

# Database
export DB_NAME="${DB_NAME:-zayjar_production}"
export DATABASE_URL="${DATABASE_URL:-}"

# Backup directories
export BACKUP_DIR="${BACKUP_DIR:-/var/backups/postgresql}"
export WAL_ARCHIVE_DIR="${WAL_ARCHIVE_DIR:-/var/backups/wal-archive}"

# Retention (days)
export RETENTION_DAILY="${RETENTION_DAILY:-7}"
export RETENTION_WEEKLY="${RETENTION_WEEKLY:-28}"
export RETENTION_MONTHLY="${RETENTION_MONTHLY:-365}"
export WAL_RETENTION_DAYS="${WAL_RETENTION_DAYS:-7}"

# S3 (for cross-region DR)
export S3_BACKUP_BUCKET="${S3_BACKUP_BUCKET:-zayjar-backups}"
export S3_BACKUP_REGION="${S3_BACKUP_REGION:-us-east-1}"
export S3_DR_REGION="${S3_DR_REGION:-eu-west-1}"

# Verification
export MAX_BACKUP_AGE_HOURS="${MAX_BACKUP_AGE_HOURS:-24}"
export MIN_BACKUP_SIZE_BYTES="${MIN_BACKUP_SIZE_BYTES:-1024}"

# Logging
export LOG_DIR="${LOG_DIR:-/var/log/zayjar}"
export LOG_FILE="${LOG_DIR}/backup.log"
