; ==============================================================================
; DOC-010 §9.2 — PgBouncer Connection Pooling Configuration
; ==============================================================================
; PgBouncer sits in front of PostgreSQL to multiplex client connections,
; reducing connection overhead and enforcing connection limits.
;
; Deployment: Docker sidecar or standalone container in front of RDS.
; Config location: /etc/pgbouncer/pgbouncer.ini
;
; Tune pool_size based on RDS instance class:
;   db.t3.medium  (2 vCPU, 4 GB)  -> pool_size = 20
;   db.r6g.large  (2 vCPU, 16 GB) -> pool_size = 40
;   db.r6g.xlarge (4 vCPU, 32 GB) -> pool_size = 80
; ==============================================================================

[databases]

; Production database connection
zayjar = host=${POSTGRES_HOST:-localhost} port=${POSTGRES_PORT:-5432} dbname=${POSTGRES_DB:-zayjar}

; Read replica for analytics / heavy queries (optional)
; zayjar_replica = host=${POSTGRES_REPLICA_HOST} port=${POSTGRES_PORT:-5432} dbname=${POSTGRES_DB:-zayjar}

[pgbouncer]

; ---------------------------------------------------------------------------
; Authentication
; ---------------------------------------------------------------------------
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ---------------------------------------------------------------------------
; Pool mode
; ---------------------------------------------------------------------------
; transaction mode: connections returned to pool after each transaction.
; Best for short-lived NestJS requests (Prisma queries).
pool_mode = transaction

; ---------------------------------------------------------------------------
; Pool sizing
; ---------------------------------------------------------------------------
; max_client_conn: total client connections PgBouncer accepts.
; pool_size: connections to actual PostgreSQL per database.
max_client_conn = 500
default_pool_size = 40
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3

; ---------------------------------------------------------------------------
; Timeouts
; ---------------------------------------------------------------------------
; Idle connections closed after this duration.
server_idle_timeout = 300

; Client connection timeout.
client_idle_timeout = 0

; Client login timeout.
client_login_timeout = 60

; ---------------------------------------------------------------------------
; Connection lifecycle
; ---------------------------------------------------------------------------
; Query timeout (0 = no timeout — let application handle).
query_timeout = 0

; Cancel key timeout.
cancel_key_timeout = 10

; Server connect timeout.
server_connect_timeout = 5

; Server login timeout.
server_login_retry = 3

; ---------------------------------------------------------------------------
; Logging & stats
; ---------------------------------------------------------------------------
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; ---------------------------------------------------------------------------
; Security
; ---------------------------------------------------------------------------
; Disable admin console in production.
admin_users = ${PGBOUNCER_ADMIN_USER:-}

; Allow status connections.
stats_users = ${PGBOUNCER_STATS_USER:-}
