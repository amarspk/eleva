; ==============================================================================
; DOC-010 §9.2 — PostgreSQL Autovacuum Tuning for Multi-Tenant SaaS
; ==============================================================================
; Apply via: ALTER SYSTEM SET <parameter> = <value>; SELECT pg_reload_conf();
; Or include via: include = '/path/to/postgresql-autovacuum.conf' in postgresql.conf
;
; Targets: RDS PostgreSQL 15+, self-managed PostgreSQL 15+
; Workload: Multi-tenant restaurant platform with high-write order tables
;           and read-heavy menu/category tables.
; ==============================================================================

; ---------------------------------------------------------------------------
; Global autovacuum toggle
; ---------------------------------------------------------------------------
autovacuum = on

; ---------------------------------------------------------------------------
; Autovacuum launcher tuning
; ---------------------------------------------------------------------------
; Maximum number of autovacuum workers (default 3).
; For a multi-tenant DB with 29+ tables, 4-6 workers prevents pile-up.
autovacuum_max_workers = 6

; Fraction of memory for autovacuum (default 0.2).
; Increase to 0.3 on dedicated DB instances to vacuum faster.
autovacuum_naptime = 30s

; ---------------------------------------------------------------------------
; Per-table scale factor thresholds
; ---------------------------------------------------------------------------
; Vacuum triggers when dead tuples exceed: scale_factor * n_live_tup + cost_limit
; Lower scale_factor = more frequent vacuuming = less bloat.
;
; High-write tables (orders, order_items, kitchen_queues, session_logs,
; audit_logs) need aggressive vacuuming.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

; ---------------------------------------------------------------------------
; Autovacuum cost delay & limit (I/O throttling)
; ---------------------------------------------------------------------------
; Reduce cost_delay to 2ms (from default 20ms) for faster vacuum on SSD-backed
; storage (RDS, EBS gp3). Increase cost_limit for more aggressive vacuuming.
autovacuum_vacuum_cost_delay = 2
autovacuum_vacuum_cost_limit = 1000

; ---------------------------------------------------------------------------
; Vacuum cost delay for aggressive cleanup on high-write tables
; ---------------------------------------------------------------------------
; For tables that accumulate dead rows quickly (orders, order_items):
; Use ALTER TABLE to set per-table overrides after initial setup.
; Example:
;   ALTER TABLE "Order" SET (
;     autovacuum_vacuum_scale_factor = 0.01,
;     autovacuum_analyze_scale_factor = 0.005,
;     autovacuum_vacuum_cost_delay = 1
;   );
;   ALTER TABLE "OrderItem" SET (
;     autovacuum_vacuum_scale_factor = 0.01,
;     autovacuum_analyze_scale_factor = 0.005,
;     autovacuum_vacuum_cost_delay = 1
;   );
;   ALTER TABLE "KitchenQueue" SET (
;     autovacuum_vacuum_scale_factor = 0.02,
;     autovacuum_vacuum_cost_delay = 1
;   );
;   ALTER TABLE "SessionLog" SET (
;     autovacuum_vacuum_scale_factor = 0.02,
;     autovacuum_vacuum_cost_delay = 1
;   );
;   ALTER TABLE "AuditLog" SET (
;     autovacuum_vacuum_scale_factor = 0.05,
;     autovacuum_vacuum_cost_delay = 2
;   );

; ---------------------------------------------------------------------------
; Statement timeout (safety net)
; ---------------------------------------------------------------------------
; Prevent long-running analytical queries from blocking vacuuming.
statement_timeout = 30000

; ---------------------------------------------------------------------------
; JIT compilation (optional, for analytical queries)
; ---------------------------------------------------------------------------
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000

; ---------------------------------------------------------------------------
; Random page cost (SSD-optimized)
; ---------------------------------------------------------------------------
; Lower random_page_cost for SSD/NVMe storage to encourage index scans.
random_page_cost = 1.1
effective_io_concurrency = 200
